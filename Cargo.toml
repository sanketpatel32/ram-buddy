[package]
name = "ram-buddy"
version = "0.1.0"
edition = "2024"
description = "A lightweight Windows tray app for monitoring RAM and stopping heavy Node.js and Python processes"
license = "MIT"
repository = "https://github.com/sanketpatel32/ram-buddy"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
